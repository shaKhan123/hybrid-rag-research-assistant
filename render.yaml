services:
  - name: rag-api
    type: web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free             # spins down after inactivity + slower cold start, but no billing required
    region: oregon         # adjust to whichever region is closest to you/Qdrant
    healthCheckPath: /health
    envVars:
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
