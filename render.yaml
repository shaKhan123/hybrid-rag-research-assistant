services:
  - name: rag-api
    type: web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter          # adjust to your Render plan; free tier works but cold-starts/sleeps
    region: oregon         # adjust to whichever region is closest to you/Qdrant
    healthCheckPath: /health
    envVars:
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
